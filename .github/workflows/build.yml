name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "keyboard.toml"
      - "vial.json"
      - "memory.x"
      - "src/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.sh"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:

# The release step creates a GitHub Release; the default token is read-only.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bindgen (nrf-sdc-sys / nrf-mpsl-sys) needs libclang; trouble-host's
      # P-256 pairing code (p256-cortex-m4-sys) is C and needs an ARM gcc.
      - name: Install libclang and the ARM C toolchain
        run: sudo apt-get update && sudo apt-get install -y libclang-dev gcc-arm-none-eabi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools

      - uses: cargo-bins/cargo-binstall@main
      - name: Install build tools
        run: cargo binstall -y flip-link cargo-binutils cargo-hex-to-uf2

      - uses: Swatinem/rust-cache@v2

      - name: Build and package (Vial and Rynk flavours)
        run: ./package.sh --host both

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/*.uf2

      # A tag `vX.Y.Z` publishes the same two files as a GitHub Release.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Aerogu34 RMK ${{ github.ref_name }}
          files: firmware/*.uf2
          generate_release_notes: true
